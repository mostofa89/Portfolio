<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="./joy.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Abu Hena Mostofa Kamal Joy — Full Stack Developer building React, Django, and DRF projects."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Abu Hena Mostofa Kamal Joy · Full Stack Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        const isLocalhost = ["localhost", "127.0.0.1", "::1"].includes(location.hostname);

        const injectStylesheet = (href) =>
          new Promise((resolve, reject) => {
            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = href;
            link.onload = resolve;
            link.onerror = reject;
            document.head.appendChild(link);
          });

        const loadProductionBundle = async () => {
          const bundleUrl = new URL("assets/app.js", location.href);
          const stylesheetUrl = new URL("assets/app.css", location.href);

          await injectStylesheet(stylesheetUrl.href);
          await import(bundleUrl.href);
        };

        if (isLocalhost) {
          import("/src/main.jsx");
          return;
        }

        const rootBundleUrl = new URL("assets/app.js", location.href);

        fetch(rootBundleUrl, { method: "HEAD", cache: "no-store" })
          .then((response) => {
            if (response.ok) {
              return loadProductionBundle();
            }

            if (location.pathname === "/Portfolio/" || location.pathname === "/Portfolio") {
              location.replace("./docs/");
              return;
            }

            return loadProductionBundle();
          })
          .catch(() => {
            if (location.pathname === "/Portfolio/" || location.pathname === "/Portfolio") {
              location.replace("./docs/");
              return;
            }

            loadProductionBundle().catch((error) => {
              console.error(error);
              document.body.innerHTML =
                '<pre style="color:#e0e7ff;padding:2rem;font-family:monospace">Unable to load the production bundle.</pre>';
            });
          });
      })();
    </script>
  </body>
</html>
