<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="./joy.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Abu Hena Mostofa Kamal Joy — Full Stack Developer building React, Django, and DRF projects."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Abu Hena Mostofa Kamal Joy · Full Stack Developer</title>
    <script type="module" crossorigin src="/Portfolio/assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="/Portfolio/assets/index.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        const isViteDev = (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname === '::1') && (location.port === '3000');
        if (!isViteDev) {
          // Block the static module script below from executing in production
          const next = document.currentScript.nextElementSibling;
          if (next && next.tagName === 'SCRIPT' && next.type === 'module' && next.src && next.src.includes('/src/main.jsx')) {
            next.type = 'javascript/blocked';
          }

          const cssPath = '/Portfolio/' + 'assets/' + 'index.css';
          const jsPath = '/Portfolio/' + 'assets/' + 'index.js';

          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = cssPath;
          document.head.appendChild(link);

          import(jsPath).catch((err) => {
            console.error('Failed to load production bundle', err);
            document.body.innerHTML = '<pre style="color:#e0e7ff;padding:2rem;font-family:monospace">Unable to load the production bundle.</pre>';
          });
        }
      })();
    </script>
  </body>
</html>
